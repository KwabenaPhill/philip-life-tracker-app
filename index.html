<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Philip Life Tracker v52</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icons/icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#000000;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;
    --gold:#f5a623;--gold2:#ffc04d;--green:#22c55e;--red:#ef4444;
    --blue:#3b9eff;--purple:#a855f7;--orange:#f97316;
    --text:#f3f3f3;--muted:#8a8a8a;--muted2:#b3b3b3;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:88px;font-size:14px;-webkit-font-smoothing:antialiased;}
  .header{background:#000;padding:10px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .header-eyebrow{font-size:9px;color:var(--muted2);font-weight:700;letter-spacing:4px;text-transform:uppercase;text-align:center;}
  .header-name{font-size:23px;font-weight:800;margin-top:1px;text-align:center;letter-spacing:.2px;line-height:1.15;}
  .header-ver{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0;vertical-align:middle;}
  /* compact one-line stat strip, Finance Hub style */
  .statbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid rgba(245,166,35,.30);border-radius:11px;padding:6px 11px;margin-top:9px;overflow:hidden;}
  .stat-ring{position:relative;width:30px;height:30px;flex-shrink:0;}
  .stat-ring svg{transform:rotate(-90deg);}
  .stat-ring svg circle{transition:stroke-dashoffset .75s cubic-bezier(.22,1,.36,1),stroke .4s ease;}
  .stat-pct{font-size:15px;font-weight:800;color:var(--gold);transition:color .4s ease;flex-shrink:0;}
  .stat-sub{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .stat-sep{flex:1;}
  .stat-date{font-size:10px;color:var(--gold);font-weight:800;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;}
  .score-bar{margin-top:7px;}
  .score-ring{position:relative;width:50px;height:50px;flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring svg circle{transition:stroke-dashoffset .75s cubic-bezier(.22,1,.36,1),stroke .4s ease;}
  .score-ring-num{transition:color .4s ease;}
  .score-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--gold);}
  .score-info{flex:1;}
  .score-title{font-size:13px;font-weight:700;}
  .score-sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .score-bar{height:4px;background:var(--border);border-radius:10px;margin-top:7px;overflow:hidden;}
  .score-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;transition:width .5s;}
  .tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:#0d0d0d;border-top:1px solid #222;z-index:100;padding:13px 4px 9px;gap:2px;overflow:hidden;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px 4px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.2px;font-family:'Poppins',sans-serif;transition:color .22s ease;-webkit-tap-highlight-color:transparent;z-index:1;}
  /* clean gold indicator bar sitting on the top edge of the active tab */
  .tab::before{content:'';position:absolute;top:-13px;left:50%;width:54px;height:4px;border-radius:0 0 5px 5px;background:var(--gold);transform:translateX(-50%) scaleX(0);opacity:0;transition:opacity .18s ease,transform .26s cubic-bezier(.22,1,.36,1);}
  .tab.active{color:var(--gold);font-weight:800;}
  .tab.active::before{opacity:1;transform:translateX(-50%) scaleX(1);}
  .tab.active .tab-icon{transform:scale(1.06);}
  .tab:active .tab-icon{transform:scale(.9);}
  .tab-icon{font-size:19px;display:block;line-height:1;transition:transform .2s cubic-bezier(.22,1,.36,1);}
  .content{padding:16px 14px;}
  .stitle{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;margin-top:20px;display:flex;align-items:center;gap:9px;}
  .stitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(245,166,35,.30),transparent);}
  .stitle:first-child{margin-top:0;}

  /* PLAN TOMORROW PERMANENT BOX */
  .plan-tmr-box{
    background:linear-gradient(135deg,#0f1f10,#0a1710);
    border:1px solid #1e4a1e;border-radius:14px;
    padding:14px 16px;margin-bottom:18px;
    display:flex;align-items:center;gap:14px;
    cursor:pointer;user-select:none;transition:border-color .2s;
  }
  .plan-tmr-box.done{background:linear-gradient(135deg,#0a2a0a,#061506);border-color:#22c55e;}
  .plan-tmr-chk{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:var(--surface2);border:2px solid #2a4a2a;
    color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .plan-tmr-box.done .plan-tmr-chk{background:var(--green);border-color:var(--green);}
  .plan-tmr-label{font-size:15px;font-weight:800;color:var(--text);}
  .plan-tmr-box.done .plan-tmr-label{color:var(--green);}
  .plan-tmr-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .plan-tmr-badge{
    margin-left:auto;font-size:10px;font-weight:800;
    padding:4px 10px;border-radius:20px;flex-shrink:0;
    background:#1e4a1e;color:#4ade80;
  }
  .plan-tmr-box.done .plan-tmr-badge{background:#22c55e;color:#000;}

  /* TASK CARD */
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;transition:border-color .25s ease,background .25s ease,opacity .3s ease,transform .22s cubic-bezier(.4,0,.2,1),box-shadow .25s ease;}
  .tcard:active{transform:scale(.988);}
  .tcard.done{opacity:.52;}
  .tcard.done .ttext{text-decoration:line-through;transition:color .3s ease;}
  .tcard.done{background:#052e1644;border-color:#16a34a44;}
  .tcard.done .ttext{text-decoration:line-through;color:var(--green);opacity:.8;}
  .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .ttext,.rname,.ctxt,.gname{overflow-wrap:anywhere;word-break:break-word;}
  .ttext{flex:1;font-size:14px;font-weight:600;line-height:1.3;}
  .tmeta{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500;}
  .edit-area{background:var(--surface2);border:1px solid var(--gold);border-radius:10px;padding:10px;margin-top:8px;display:none;}
  .edit-area.open{animation:slideDown .3s cubic-bezier(.22,1,.36,1);}
  .edit-area.open{display:block;}
  .erow{display:flex;gap:6px;margin-bottom:6px;}
  .chk{width:26px;height:26px;border-radius:7px;flex-shrink:0;background:var(--surface2);border:2px solid var(--border);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .22s ease,border-color .22s ease,transform .2s cubic-bezier(.34,1.5,.64,1);font-family:inherit;-webkit-tap-highlight-color:transparent;}
  .chk:active{transform:scale(.86);}
  .chk.on{animation:popIn .32s cubic-bezier(.34,1.5,.64,1);}
  .chk.on{background:var(--green);border-color:var(--green);}
  .input{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;outline:none;width:100%;font-family:'Poppins',sans-serif;transition:border-color .2s;font-weight:500;}
  .input:focus{border-color:var(--gold);}
  .input-sm{padding:8px 10px;font-size:13px;}
  select.input{cursor:pointer;}
  .btn{background:var(--gold);color:#000;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Poppins',sans-serif;transition:opacity .2s,transform .16s cubic-bezier(.4,0,.2,1),box-shadow .22s ease,filter .2s ease;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px rgba(245,166,35,.16);}
  .btn:active{transform:scale(.965);filter:brightness(1.08);}
  .btn-green{box-shadow:0 2px 10px rgba(34,197,94,.18);}
  .btn-danger{box-shadow:none;}
  .btn-danger:active{transform:scale(.965);background:#2a0d0d;filter:none;}
  .btn-nuke{animation:pulseRed 2.8s ease-in-out infinite;border-color:#4a1818!important;}
  .btn-nuke:active{background:#3a0f0f!important;}
  .ibtn{transition:transform .18s cubic-bezier(.34,1.5,.64,1),opacity .2s;-webkit-tap-highlight-color:transparent;}
  .ibtn:active{transform:scale(.82);}
  .btn:hover{opacity:.85;}
  .btn-icon{width:40px;height:40px;padding:0;font-size:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .btn-green{background:var(--green);color:#000;}
  .btn-outline{background:var(--surface2);color:var(--muted2);border:1px solid var(--border);}
  .btn-danger{background:#1a0a0a;color:var(--red);border:1px solid #2a1010;}
  .btn-full{width:100%;border-radius:12px;padding:13px;font-size:14px;margin-bottom:8px;}
  .add-form{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:14px;}
  .add-title{font-size:10px;font-weight:800;color:var(--gold);margin-bottom:10px;letter-spacing:1.5px;text-transform:uppercase;}
  .irow{display:flex;gap:7px;margin-bottom:8px;align-items:center;}
  .habit-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;user-select:none;}
  .habit-card.done{background:#052e1644;border-color:#16a34a55;}
  .hicon{width:42px;height:42px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .habit-card.done .hicon{background:#16a34a22;}
  .hname{font-weight:700;font-size:14px;}
  .habit-card.done .hname{color:var(--green);}
  .streak{font-size:10px;color:var(--gold);font-weight:800;background:#f5a62320;border-radius:6px;padding:3px 8px;flex-shrink:0;}
  .cat-grp{margin-bottom:16px;}
  .cat-hdr{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:8px 12px;background:var(--surface);border-radius:10px;border-left:3px solid;}
  .cat-hdr-name{font-weight:800;font-size:12px;}
  .cat-count{font-size:10px;color:var(--muted);margin-left:auto;font-weight:600;}
  .cat-pct{font-size:11px;font-weight:800;margin-left:6px;}
  .qdbar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .cbadge{display:inline-block;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;letter-spacing:.3px;}
  .cb-new{background:#2a0d0d;color:#f87171;border:1px solid #3a1414;}
  .cb-mid{background:#320d0d;color:#ef4444;border:1px solid #4a1414;}
  .cb-old{background:#450a0a;color:#fff;border:1px solid #7f1d1d;}
  .tcard.carried{border-left:3px solid #f87171;}
  .tcard.carried-mid{border-left:3px solid #ef4444;}
  .tcard.carried-old{border-left:3px solid #dc2626;}
  .movebtn{color:var(--green);font-weight:800;}
  .rollbar{display:flex;align-items:center;gap:9px;background:#1a0a0a;border:1px solid #3a1414;border-radius:12px;padding:13px 15px;margin-top:12px;cursor:pointer;transition:transform .2s cubic-bezier(.4,0,.2,1),filter .22s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent;}
  .rollbar:active{transform:scale(.985);filter:brightness(1.14);}
  .rollbar-a{transition:transform .32s cubic-bezier(.34,1.4,.64,1);}
  .rollwrap{animation:slideDown .38s cubic-bezier(.22,1,.36,1);overflow:hidden;}
  .rollbar-c{transition:transform .3s cubic-bezier(.34,1.5,.64,1);}
  .rollbar:active{background:#240d0d;}
  .rollbar-t{flex:1;font-size:12.5px;font-weight:800;color:#ef4444;}
  .rollbar-s{font-size:10px;color:var(--muted2);font-weight:600;margin-top:2px;}
  .rollbar-c{font-size:18px;font-weight:800;color:#ef4444;}
  .rollbar-a{font-size:13px;color:#ef4444;font-weight:800;}
  .rollwrap{margin-top:10px;}
  .fromday{font-size:9px;color:var(--muted2);font-weight:600;}
  .bkrow{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px;}
  .bkhead{display:flex;align-items:flex-start;gap:8px;}
  .bktext{font-size:13px;font-weight:700;color:var(--text);overflow-wrap:anywhere;word-break:break-word;}
  .bkmeta{font-size:10px;color:var(--muted2);font-weight:600;margin-top:3px;}
  .bkdue{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;margin-top:5px;}
  .bk-over{background:#2a0d0d;color:#ef4444;border:1px solid #3a1414;}
  .bk-soon{background:#2a2008;color:var(--gold);border:1px solid #3a2d0a;}
  .bk-ok{background:var(--surface);color:var(--muted2);border:1px solid var(--border);}
  .bk-none{background:var(--surface);color:var(--muted2);border:1px solid var(--border);}
  .bkbtns{display:flex;gap:6px;margin-top:9px;}
  .bkb{flex:1;border:none;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Poppins',sans-serif;}
  .bkb-today{background:var(--green);color:#000;}
  .bkb-date{background:var(--surface);color:var(--gold);border:1px solid var(--gold);}
  .alertbar{background:#2a0d0d;border:1px solid #3a1414;color:#ef4444;border-radius:11px;padding:11px 13px;font-size:12px;font-weight:700;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .rtbtn{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--muted2);border-radius:9px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .15s;}
  .rtbtn.on{background:var(--gold);border-color:var(--gold);color:#000;}
  .rtbar{display:flex;gap:6px;margin-bottom:10px;}
  .lastday{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px;}
  .lastday input{width:16px;height:16px;accent-color:var(--gold);flex-shrink:0;}
  .dchip{background:var(--surface2);border:1px solid var(--border);color:var(--muted2);border-radius:8px;width:34px;height:34px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Poppins',sans-serif;transition:background .22s ease,border-color .22s ease,color .22s ease,transform .2s cubic-bezier(.34,1.5,.64,1);flex:1;-webkit-tap-highlight-color:transparent;}
  .dchip:active{transform:scale(.88);}
  .dchip.on{animation:popIn .3s cubic-bezier(.34,1.5,.64,1);box-shadow:0 2px 8px rgba(245,166,35,.28);}
  .dchip.on{background:var(--gold);border-color:var(--gold);color:#000;}
  .dchiprow{display:flex;gap:4px;margin-bottom:8px;}
  .rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
  .rname{font-size:13px;font-weight:700;color:var(--text);}
  .rmeta{font-size:10px;color:var(--muted2);font-weight:600;margin-top:2px;}
  .rtime{font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap;}
  .qbtn{background:var(--surface2);border:1px solid var(--border);color:var(--muted2);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .15s;}
  .qbtn.active{background:var(--gold);color:#000;border-color:var(--gold);}
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .rev-score{font-size:40px;font-weight:800;}
  .week-bars{display:flex;gap:6px;margin-bottom:20px;}
  .wbw{flex:1;text-align:center;}
  .wb{height:55px;border-radius:7px;margin-bottom:4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;}
  .wgrid{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;overflow-x:auto;}
  .wrow{display:grid;grid-template-columns:85px repeat(7,1fr);gap:3px;margin-bottom:3px;align-items:center;}
  .wlabel{font-size:9px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;font-weight:600;}
  .wcell{height:22px;border-radius:5px;}
  .wdhdr{font-size:9px;color:var(--muted);text-align:center;font-weight:700;}
  .wdhdr.tc{color:var(--gold);}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 0;line-height:1.7;}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(14px) scale(.94);background:#1a3a1a;color:var(--green);border:1px solid var(--green);padding:9px 18px;border-radius:20px;font-weight:700;font-size:12px;z-index:999;opacity:0;transition:opacity .3s ease,transform .38s cubic-bezier(.34,1.4,.64,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 26px rgba(0,0,0,.55);}
  .toast.show{transform:translateX(-50%) translateY(0) scale(1);}
  .toast.show{opacity:1;}
  ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fi{animation:fi .34s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes popIn{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px);max-height:0}to{opacity:1;transform:translateY(0);max-height:4000px}}
  @keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 6px rgba(239,68,68,.10)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  /* staggered card entrance */
  .fi .tcard,.fi .bkrow,.fi .habit-card,.fi .cat-grp,.fi .rrow{animation:rise .38s cubic-bezier(.22,1,.36,1) backwards;}
  .fi .tcard:nth-child(1),.fi .bkrow:nth-child(1){animation-delay:.02s}
  .fi .tcard:nth-child(2),.fi .bkrow:nth-child(2){animation-delay:.05s}
  .fi .tcard:nth-child(3),.fi .bkrow:nth-child(3){animation-delay:.08s}
  .fi .tcard:nth-child(4),.fi .bkrow:nth-child(4){animation-delay:.11s}
  .fi .tcard:nth-child(5),.fi .bkrow:nth-child(5){animation-delay:.13s}
  .fi .tcard:nth-child(n+6){animation-delay:.15s}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  .ibtn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;color:var(--muted);flex-shrink:0;}
  .ibtn:hover{color:var(--text);}
  .missed-box{background:#1a0a0a;border:1px solid #3a1010;border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .missed-title{font-size:10px;font-weight:800;color:var(--red);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
  .missed-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2a1010;}

  /* CHALLENGE CARDS */
  .ch-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .ch-card.complete{border-color:var(--green);background:#052e1622;}
  .ch-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;}
  .ch-name{font-size:15px;font-weight:800;line-height:1.25;}
  .ch-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;}
  .ch-count{font-size:11px;font-weight:800;color:var(--gold);background:#f5a62318;border-radius:8px;padding:5px 10px;white-space:nowrap;flex-shrink:0;}
  .ch-card.complete .ch-count{color:var(--green);background:#22c55e1a;}
  .ch-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:11px;}
  .ch-fill{height:100%;border-radius:10px;transition:width .5s;}
  .ch-row{display:flex;align-items:center;gap:8px;}
  .ch-pct{font-size:15px;font-weight:800;}
  .ch-row .btn{padding:9px 14px;font-size:13px;}
  .ch-reset{font-size:12px!important;padding:9px 12px!important;}
  .btn:disabled{cursor:default;}
  .ch-done{background:var(--green)!important;color:#000!important;opacity:1!important;}
  .flbl{font-size:9px;color:var(--muted2);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px;}
  .ch-status{font-size:11px;font-weight:700;}
  .chk.sm{width:24px;height:24px;font-size:11px;border-radius:6px;}

  /* CONTENT TAB */
  .cday{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:11px;}
  .cday.today{border-color:var(--gold);background:linear-gradient(135deg,#1a1408,#141414);}
  .cday-hdr{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .cday-name{font-size:14px;font-weight:800;}
  .cday.today .cday-name{color:var(--gold);}
  .cday-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px;}
  .cday-badge{margin-left:auto;font-size:9px;font-weight:800;background:var(--gold);color:#000;border-radius:20px;padding:4px 9px;flex-shrink:0;}
  .ctask{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ctask:last-of-type{border-bottom:none;}
  .ctask.done .ctxt{text-decoration:line-through;color:var(--green);opacity:.75;}
  .cbullet{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;margin:0 9px;}
  .ctxt{flex:1;font-size:13px;font-weight:600;line-height:1.4;min-width:0;white-space:pre-line;}
  .cadd{display:flex;gap:6px;margin-top:9px;align-items:center;}

  /* CHALLENGE GROUPS (image-2 style) */
  .cg-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px;}
  .cg-card.complete{border-color:var(--green);background:#0a1a0e;}
  .cg-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;}
  .cg-name{font-size:17px;font-weight:800;line-height:1.2;}
  .cg-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;}
  .cg-day{font-size:11px;font-weight:800;color:var(--gold);background:#f5a62318;border-radius:8px;padding:6px 11px;white-space:nowrap;flex-shrink:0;}
  .cg-scorebar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .cg-score{font-size:22px;font-weight:800;color:var(--text);}
  .cg-scorelbl{font-size:11px;color:var(--muted);font-weight:600;}
  .cg-pct{font-size:22px;font-weight:800;color:var(--gold);}
  .cg-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:13px;}
  .cg-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s;}
  .cg-rules{font-size:9px;font-weight:800;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:6px;}
  .cg-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);}
  .cg-item:last-of-type{border-bottom:none;}
  .cg-item.done .ctxt{text-decoration:line-through;color:var(--green);opacity:.75;}
  .cg-num{font-size:11px;color:var(--muted);font-weight:700;width:16px;flex-shrink:0;text-align:center;}
  .cg-actions{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:11px;border-top:1px solid var(--border);}

  /* CHALLENGE PROGRESS TRACK */
  .cg-track-lbl{font-size:9px;font-weight:800;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px;}
  .cg-track{display:flex;flex-wrap:wrap;gap:4px;}
  .cg-cell{width:15px;height:15px;border-radius:4px;background:#242424;border:1px solid transparent;}
  .cg-cell.full{background:var(--green);}
  .cg-cell.part{background:var(--gold);}
  .cg-cell.miss{background:#3a1414;}
  .cg-cell.future{background:transparent;border:1px solid var(--border);}
  .cg-cell.current{border:1px solid var(--gold);}
  .cg-cell.current.full{border-color:#fff;}
  .cg-cell.current.part{border-color:#fff;}
  .cg-track-key{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:10px;color:var(--muted);font-weight:600;}
  .cg-track-key span{display:flex;align-items:center;gap:5px;}
  .cg-track-key i.k{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .cg-track-key i.k.full{background:var(--green);}
  .cg-track-key i.k.part{background:var(--gold);}
  .cg-track-key i.k.miss{background:#3a1414;}
  .cg-track-key i.k.current{background:#242424;border:1px solid var(--gold);}

  /* CONTENT SETTINGS */
  .cs-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px;transition:opacity .25s ease,border-color .2s ease,background .2s ease;}
  .cs-card.paused{border-color:#493713;background:#17140d;opacity:.76;}
  .cs-top{display:flex;align-items:flex-start;gap:10px;}
  .cs-info{flex:1;min-width:0;}
  .cs-name{font-size:13.5px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;word-break:break-word;}
  .cs-meta{font-size:10px;color:var(--muted2);font-weight:600;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .cs-badge{font-size:9px;font-weight:800;border-radius:20px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .cs-badge.active{background:#17391f;color:#4ade80;border:1px solid #23562e;}
  .cs-badge.paused{background:#3a2a0f;color:#f6c45d;border:1px solid #5b4217;}
  .cs-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .cs-section{margin-bottom:15px;}
  .cs-section-title{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:8px 11px;background:var(--surface);border-radius:10px;border-left:3px solid var(--gold);}
  .cs-section-title strong{font-size:12px;}
  .cs-section-count{margin-left:auto;font-size:9px;color:var(--muted);font-weight:700;}
  .cs-note{font-size:10.5px;color:var(--muted2);line-height:1.6;margin:-3px 0 11px;}
  /* PASTE WHOLE PLAN */
  .paste-plan-card{background:linear-gradient(135deg,#0D1A2A,#0D0D0D);border:1px solid #1A3A5E;border-radius:16px;padding:14px;margin-bottom:12px;}
  .paste-plan-card h4{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:4px;}
  .paste-plan-card p{font-size:11px;color:var(--muted2);margin-bottom:11px;line-height:1.45;}
  .paste-plan-btn{background:linear-gradient(135deg,#3b9eff,#1f6fb8);color:#fff;}
  .pp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:220;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .22s ease;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .pp-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:17px 16px 28px;width:100%;max-width:520px;max-height:91vh;overflow-y:auto;animation:modalIn .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -18px 60px rgba(0,0,0,.6);}
  .pp-title{font-size:16px;font-weight:900;margin-bottom:4px;}
  .pp-hint{font-size:11px;color:var(--muted2);line-height:1.5;margin-bottom:11px;}
  .pp-text{width:100%;min-height:190px;max-height:42vh;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px;font-family:'Poppins',sans-serif;font-size:13px;line-height:1.5;resize:vertical;}
  .pp-text:focus{outline:none;border-color:var(--blue);}
  .pp-summary{background:#0D1A2A;border:1px solid #1A3A5E;border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:11px;color:var(--muted2);line-height:1.55;}
  .pp-summary b{color:var(--text);}
  .pp-row{background:#101010;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;}
  .pp-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .pp-row-main{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;}
  .pp-badge{font-size:9px;font-weight:800;border-radius:20px;padding:3px 8px;white-space:nowrap;}
  .pp-badge.task{background:#33240c;color:var(--gold);border:1px solid #5a3c10;}
  .pp-badge.routine{background:#12351d;color:#4ade80;border:1px solid #23562e;}
  .pp-badge.content{background:#1A0D2A;color:var(--purple);border:1px solid #3A2A4E;}
  .pp-badge.bank{background:#0D1A2A;color:var(--blue);border:1px solid #1A3A5E;}
  .pp-meta{font-size:10px;color:var(--muted);font-weight:700;}
  .pp-remove{border:none;background:transparent;color:var(--red);font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;}
  .pp-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:7px;}
  .pp-grid.one{grid-template-columns:1fr;}
  .pp-field{min-width:0;}
  .pp-field .flbl{margin-bottom:4px;}
  .pp-cat,.pp-time,.pp-day{width:100%;}
  .pp-actions{display:flex;gap:8px;margin-top:12px;}
  .pp-actions .btn{flex:1;}
  .pp-empty{font-size:12px;color:var(--muted);text-align:center;padding:18px 10px;border:1px dashed var(--border);border-radius:12px;margin-bottom:10px;}
  .pp-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px;}
  .pp-daychip{flex:1 0 calc(25% - 4px);min-width:54px;padding:7px 5px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--muted2);font-size:10.5px;font-weight:800;cursor:pointer;text-align:center;}
  .pp-daychip.on{background:#172a1c;border-color:#2f6b3b;color:#4ade80;}
  .pp-repeatbar{display:flex;gap:6px;margin-bottom:6px;}
  .pp-repeatbtn{flex:1;padding:8px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--muted2);font-size:11px;font-weight:800;cursor:pointer;}
  .pp-repeatbtn.on{background:#172a1c;border-color:#2f6b3b;color:#4ade80;}
  .pp-conflict{background:#2a210d;border:1px solid #5a4513;border-radius:12px;padding:12px;margin-bottom:10px;font-size:11px;color:var(--muted2);line-height:1.55;}
  .pp-conflict b{color:#f6c45d;}
  .pp-choice{background:#101010;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .pp-choice h3{font-size:15px;font-weight:900;margin-bottom:5px;}
  .pp-choice p{font-size:11px;color:var(--muted2);line-height:1.5;margin-bottom:11px;}
  .pp-choice-note{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.45;}
  .pp-undo-banner{background:linear-gradient(135deg,#0D1A2A,#0D0D0D);border:1px solid #1A3A5E;border-radius:14px;padding:11px 12px;margin-bottom:12px;display:flex;align-items:center;gap:9px;}
  .pp-undo-main{flex:1;min-width:0;font-size:11px;color:var(--muted2);line-height:1.4;}
  .pp-undo-main b{color:var(--text);}
  .pp-undo-btn{flex:0 0 auto;padding:8px 11px;border-radius:10px;background:#1f6fb8;border:1px solid #3b9eff;color:#fff;font-size:11px;font-weight:900;cursor:pointer;}
  /* COPY TASKS MODAL */
  .copy-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s ease;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
  .copy-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;width:100%;max-width:440px;animation:modalIn .34s cubic-bezier(.22,1,.36,1);box-shadow:0 22px 60px rgba(0,0,0,.6);}
  .copy-title{font-size:16px;font-weight:800;margin-bottom:4px;}
  .copy-hint{font-size:11px;color:var(--muted2);margin-bottom:11px;line-height:1.4;}
  .copy-text{width:100%;height:190px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px;font-family:'Poppins',sans-serif;font-size:13px;line-height:1.5;resize:none;box-sizing:border-box;}
  .copy-btns{display:flex;gap:8px;margin-top:11px;}
  .btn-ghost{background:var(--surface2);color:var(--text);}

  /* =========================================================
     v41 CLEAN TONAL INTERFACE
     Visual-only layer. Existing markup, behavior and storage keys preserved.
     ========================================================= */
  :root{
    --bg:#060914;
    --surface:#0f1728;
    --surface2:#151f34;
    --surface3:#1b2842;
    --border:rgba(255,255,255,.10);
    --gold:#ffc857;
    --gold2:#ffe08a;
    --green:#35d98a;
    --red:#ff5f78;
    --blue:#55a8ff;
    --purple:#9a84ff;
    --orange:#ff9f5a;
    --text:#f7f8ff;
    --muted:#8390ae;
    --muted2:#b3bdd3;
  }
  html{background:var(--bg);}
  body{
    max-width:560px;
    background:
      radial-gradient(600px 340px at -10% -8%,rgba(114,94,255,.28),transparent 58%),
      radial-gradient(520px 300px at 108% 18%,rgba(52,169,255,.18),transparent 58%),
      radial-gradient(500px 340px at 45% 110%,rgba(47,224,151,.10),transparent 62%),
      var(--bg);
    color:var(--text);
    padding-bottom:104px;
    letter-spacing:.01em;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 28%,rgba(255,255,255,.01));
  }
  .header{
    padding:12px 14px 11px;
    background:rgba(6,9,20,.78);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
  }
  .header-eyebrow{color:#9ba5be;letter-spacing:4px;font-size:8px;}
  .header-name{
    font-size:24px;margin-top:2px;letter-spacing:-.02em;
    background:linear-gradient(100deg,#fff 10%,#d9d3ff 58%,#8dcfff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .header-ver{color:#8490ad;font-size:10px;}
  .statbar{
    margin-top:10px;
    background:linear-gradient(135deg,rgba(26,37,61,.92),rgba(13,20,34,.88));
    border:1px solid rgba(154,132,255,.24);
    border-radius:16px;
    padding:7px 11px;
    box-shadow:0 10px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035);
  }
  .stat-pct{font-size:15px;color:var(--purple);}
  .stat-sub{color:#9aa5bd;}
  .stat-date{color:var(--gold);}
  .score-bar{height:5px;margin-top:8px;background:rgba(255,255,255,.07);}
  .score-fill{background:linear-gradient(90deg,#7868ff,#4cb7ff);box-shadow:0 0 16px rgba(111,104,255,.32);}
  .tabs{
    left:10px;right:10px;bottom:10px;max-width:540px;
    padding:7px 7px 6px;gap:4px;
    background:rgba(10,15,27,.86);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.44),0 4px 14px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
  }
  .tab{border-radius:15px;padding:7px 2px 6px;color:#7f8aa4;}
  .tab:hover{color:#cbd3e5;}
  .tab.active{color:#fff;background:linear-gradient(180deg,rgba(126,109,255,.20),rgba(76,131,255,.10));}
  .tab::before{top:-7px;width:42px;height:3px;background:linear-gradient(90deg,#9b85ff,#4cb7ff);box-shadow:0 0 14px rgba(120,105,255,.42);}
  .tab-icon{font-size:18px;filter:saturate(.92);}
  .content{padding:17px 14px 10px;}
  .stitle{color:#9f91ff;letter-spacing:2.2px;margin-top:22px;margin-bottom:10px;font-size:10px;}
  .stitle::after{background:linear-gradient(90deg,rgba(137,117,255,.38),transparent);}
  .divider{background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);margin:20px 0;}
  .plan-tmr-box{
    background:linear-gradient(135deg,rgba(18,42,46,.90),rgba(13,26,34,.90));
    border:1px solid rgba(53,217,138,.18);border-radius:18px;
    padding:14px 15px;box-shadow:0 12px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035);
  }
  .plan-tmr-box.done{background:linear-gradient(135deg,rgba(18,53,44,.95),rgba(11,30,28,.92));border-color:rgba(53,217,138,.45);}
  .plan-tmr-chk{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.12);}
  .plan-tmr-label{font-size:14px;}
  .plan-tmr-sub{color:#8e9ab2;}
  .plan-tmr-badge{background:rgba(53,217,138,.12);color:#67e7a8;border:1px solid rgba(53,217,138,.12);}
  .plan-tmr-box.done .plan-tmr-badge{background:var(--green);color:#06140e;}
  .tcard,.habit-card,.rev-card,.cg-card,.ch-card,.cday,.wgrid,.qdbar,.bkrow,.cs-card{
    background:linear-gradient(145deg,rgba(17,26,44,.96),rgba(12,19,33,.94));
    border-color:rgba(255,255,255,.085);
    box-shadow:0 10px 26px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.028);
  }
  .tcard{border-radius:16px;padding:13px 14px;margin-bottom:8px;}
  .tcard:hover,.habit-card:hover,.cg-card:hover,.ch-card:hover,.cday:hover,.bkrow:hover,.cs-card:hover{
    border-color:rgba(146,132,255,.26);box-shadow:0 12px 32px rgba(0,0,0,.18),0 0 0 1px rgba(146,132,255,.04) inset;
  }
  .tcard.done{background:linear-gradient(145deg,rgba(9,35,32,.85),rgba(9,25,29,.88));border-color:rgba(53,217,138,.18);}
  .cdot{box-shadow:0 0 10px currentColor;}
  .chk{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.12);}
  .chk.on{background:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(53,217,138,.27);}
  .input{
    background:rgba(7,12,23,.88);border-color:rgba(255,255,255,.10);border-radius:13px;color:#f7f8ff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.022);
  }
  .input:focus{border-color:rgba(143,124,255,.78);box-shadow:0 0 0 3px rgba(143,124,255,.10);}
  .btn{
    background:linear-gradient(135deg,#8471ff,#5c96ff);color:#fff;border-radius:13px;border:1px solid rgba(255,255,255,.08);
    box-shadow:0 9px 20px rgba(101,91,241,.20),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn:hover{opacity:1;filter:brightness(1.06);}
  .btn-green{background:linear-gradient(135deg,#29c985,#38e29a);box-shadow:0 9px 20px rgba(42,201,133,.18),inset 0 1px 0 rgba(255,255,255,.14);}
  .btn-outline,.btn-ghost{background:rgba(255,255,255,.045);color:#bdc6d9;border:1px solid rgba(255,255,255,.10);box-shadow:none;}
  .btn-danger{background:linear-gradient(135deg,#2a1119,#1c0c12);color:#ff7890;border-color:rgba(255,95,120,.15);}
  .btn-nuke{box-shadow:0 0 0 0 rgba(255,95,120,0);}
  .add-form{
    background:linear-gradient(145deg,rgba(18,27,46,.96),rgba(12,19,33,.94));
    border:1px solid rgba(143,124,255,.23);border-radius:18px;padding:15px;
    box-shadow:0 14px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.03);
  }
  .add-title{color:#b1a4ff;letter-spacing:1.8px;}
  .qbtn,.rtbtn,.dchip{
    background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09);color:#a9b3c8;border-radius:11px;
  }
  .qbtn.active,.rtbtn.on,.dchip.on{background:linear-gradient(135deg,#806eff,#5d93ff);border-color:transparent;color:#fff;box-shadow:0 7px 18px rgba(105,92,240,.18);}

// Unfinished tasks from past days stay on their ORIGINAL date (so History and past

let showRolled=false;

const CARRY_MAX=10; // tasks stop rolling over after this many days
// Unfinished CONTENT from past days, kept separate from task roll-over
function carriedContent(){
  if(!CO)return [];
  const today=tod();const todayTasks=T[today]||[];const out=[];
  for(let n=1;n<=CARRY_MAX;n++){
    const d=addDays(today,-n);
    if(CST&&d<CST)break;
    const items=cget(new Date(d+'T00:00:00').getDay());
    items.forEach(it=>{
      if(!it.paused&&!CC[d]?.[it.id]){
        const movedToToday=todayTasks.some(t=>t._contentCarry&&t._contentCarry.date===d&&t._contentCarry.id===it.id);
        if(!movedToToday)out.push({it,date:d,days:n});
      }
    });
  }
  out.sort((a,b)=>b.days-a.days);
  return out;
}
function moveContentToToday(date,id){

  const item=cget(srcDay).find(x=>x.id===id);

  if(existing)return toast('Already moved to today ✅');

function carriedTasks(){
  if(!CO)return [];
  const today=tod();const out=[];
  Object.keys(T).forEach(d=>{
    if(d>=today)return;
    const n=dDays(d,today);
    if(n>CARRY_MAX)return; // older than the window: stops following you
    (T[d]||[]).forEach(t=>{
      if(!t.done||t.doneAt===today){
        out.push({t,date:d,days:n});

  });
  out.sort((a,b)=>b.days-a.days||(a.t.createdAt||0)-(b.t.createdAt||0));

function carryHue(days){

function dayScore(date){

  return {done,total,pct:total?Math.round(done/total*100):0};
}

function moveAllToToday(){
  const today=tod();
  const cr=carriedTasks().filter(c=>!c.t.done);
  if(!cr.length)return toast('Nothing to move');
  if(!confirm(`Move all ${cr.length} rolled-over task${cr.length!==1?'s':''} into today?`))return;
  if(!T[today])T[today]=[];
  let n=0;
  cr.forEach(c=>{
    const src=T[c.date]||[];
    const t=src.find(x=>x.id===c.t.id);
    if(!t)return;
    T[c.date]=src.filter(x=>x.id!==c.t.id);
    if(!T[c.date].length)delete T[c.date];
    T[today].push({...t,done:false,doneAt:undefined,createdAt:Date.now()+n});
    n++;
  });
  sT();render();toast(`${n} task${n!==1?'s':''} moved to today \u2705`);
}
function moveToToday(date,id){
  const today=tod();
  if(date===today)return;
  const src=T[date]||[];
  const t=src.find(x=>x.id===id);
  if(!t)return;
  T[date]=src.filter(x=>x.id!==id);
  if(!T[date].length)delete T[date];
  if(!T[today])T[today]=[];
  T[today].push({...t,done:false,doneAt:undefined,createdAt:Date.now()});
  sT();render();toast('Moved to today ✅');
}
function togEdit(tid,pfx){document.getElementById('ea_'+(pfx||'')+tid)?.classList.toggle('open');}
function saveEdit(date,tid,pfx){
  const p=pfx||'';
  const nt=document.getElementById('et_'+p+tid)?.value?.trim();
  const nc=document.getElementById('ec_'+p+tid)?.value;
  if(!nt)return toast('Task cannot be empty!');
  if(!T[date])return;
  T[date]=T[date].map(t=>t.id===tid?{...t,text:nt,catId:nc}:t);
  sT();render();toast('Updated ✅');
}
function togTask(date,id){
  if(!T[date])return;
  T[date]=T[date].map(t=>t.id===id?{...t,done:!t.done,doneAt:!t.done?tod():undefined}:t);
  sT();render();
}
function delTask(date,id){
  if(!T[date])return;
  T[date]=T[date].filter(t=>t.id!==id);
  sT();render();toast('Task removed');
}

function groupHTML(list,date,editable=false){
  const g={};
  list.forEach(t=>{if(!g[t.catId])g[t.catId]=[];g[t.catId].push(t);});
  return Object.keys(g).map(cid=>{
    const cat=gc(cid),gr=g[cid],dn=gr.filter(t=>t.done).length,pct=Math.round(dn/gr.length*100);
    return`<div class="cat-grp">
      <div class="cat-hdr" style="border-left-color:${cat.color}">
        <span>${cat.icon}</span><span class="cat-hdr-name">${cat.name}</span>
        <span class="cat-count">${dn}/${gr.length}</span>
        <span class="cat-pct" style="color:${cat.color}">${pct}%</span>

      ${gr.map(t=>editable?tcHTML(t,date,null,'g'):`<div class="tcard ${t.done?'done':''}">

    </div>`;
  }).join('');
}

// ---- TODAY WEEKLY PROGRESS ----
function weekMonday(date){
  const d=new Date(date+'T00:00:00');
  const offset=(d.getDay()+6)%7;
  d.setDate(d.getDate()-offset);
  return d.toISOString().split('T')[0];
}
function currentWeekDates(date){
  const mon=weekMonday(date);
  return Array.from({length:7},function(_,i){return addDays(mon,i);});
}

function removePasteItem(i){syncPasteDraft();pasteWholeDraft.splice(i,1);renderPasteReview(0);}
function syncPasteDraft(){

}
function togglePasteDay(i,d,type){

  const ix=arr.indexOf(d);if(ix>=0)arr.splice(ix,1);else arr.push(d);arr.sort((a,b)=>a-b);it[key]=arr;it.needsSchedule=false;renderPasteReview(0);
}
function setPasteRepeatType(i,type){

  it.repeatType=type;if(type==='weekly'){if(!it.days?.length)it.days=[pasteWeekDay(pDate)];it.lastDay=false;it.dayOfMonth=null;}else{it.days=[];if(!it.interval)it.interval=1;if(!it.dayOfMonth&&!it.lastDay)it.dayOfMonth=1;}it.needsSchedule=false;renderPasteReview(0);

function togglePasteLastDay(i){syncPasteDraft();const it=pasteWholeDraft[i];if(!it)return;it.lastDay=!it.lastDay;if(it.lastDay)it.dayOfMonth=null;else if(!it.dayOfMonth)it.dayOfMonth=1;it.needsSchedule=false;renderPasteReview(0);}
function affectedPasteTaskDates(){

function pasteTaskConflictInfo(){

function showPasteChoice(){

function sameTask(date,text){const q=text.trim().toLowerCase();return gt(date).some(t=>(t.text||'').trim().toLowerCase()===q);}
function sameBank(text){const q=text.trim().toLowerCase();return BK.some(b=>(b.text||'').trim().toLowerCase()===q);}
function sameRoutine(text,time,days,repeatType,dayOfMonth,lastDay,interval){const q=text.trim().toLowerCase();return R.some(r=>(r.text||'').trim().toLowerCase()===q&&(r.time||'')===(time||'')&&(r.repeatType||'weekly')===(repeatType||'weekly')&&JSON.stringify((r.days||[]).slice().sort((a,b)=>a-b))===JSON.stringify((days||[]).slice().sort((a,b)=>a-b))&&(+r.dayOfMonth||null)===(+dayOfMonth||null)&&!!r.lastDay===!!lastDay&&(r.interval||1)===(interval||1));}
function sameContent(day,text){const q=text.trim().toLowerCase();return cget(day).some(t=>(t.text||'').trim().toLowerCase()===q);}
function recordPasteUndo(){

}
function showPasteUndoBanner(){

  const parts=[];if(p.addedTasks.length)parts.push(`${p.addedTasks.length} task${p.addedTasks.length!==1?'s':''}`);if(p.addedRoutine.length)parts.push(`${p.addedRoutine.length} routine${p.addedRoutine.length!==1?'s':''}`);if(p.addedContent.length)parts.push(`${p.addedContent.length} content item${p.addedContent.length!==1?'s':''}`);if(p.addedBank.length)parts.push(`${p.addedBank.length} Task Bank item${p.addedBank.length!==1?'s':''}`);
  const total=parts.join(' · ')||'pasted items';
  return `<div class="pp-undo-banner"><div class="pp-undo-main"><b>✅ Paste added.</b><br>${esc(total)}${p.replacedDates.length?` · ${p.replacedDates.length} date${p.replacedDates.length!==1?'s':''} replaced`:''}</div><button class="pp-undo-btn" onclick="undoLastPaste()">↩ Undo Paste</button></div>`;
}
function undoLastPaste(){
  const p=pasteUndoState;if(!p)return toast('Undo window expired');
  clearTimeout(pasteUndoTimer);
  p.addedTasks.forEach(x=>{T[x.date]=(T[x.date]||[]).filter(t=>t.id!==x.id);if(!T[x.date].length)delete T[x.date];});
  p.replacedDates.forEach(d=>{const old=p.replacedTasks[d]||[];const cur=T[d]||[];const ids=new Set(old.map(t=>t.id));const keep=cur.filter(t=>!ids.has(t.id));T[d]=old.concat(keep);});
  if(!p.replacedDates.length){/* nothing to restore */}
  p.addedRoutine.forEach(id=>{R=R.filter(r=>r.id!==id);});
  p.addedBank.forEach(id=>{BK=BK.filter(b=>b.id!==id);});
  p.addedContent.forEach(x=>{CPLAN[x.day]=(CPLAN[x.day]||[]).filter(t=>t.id!==x.id);if(!CPLAN[x.day].length)delete CPLAN[x.day];});

function finishPasteApply(mode){
  syncPasteDraft();pasteWholeDraft=pasteWholeDraft.filter(x=>x.text);
  if(!pasteWholeDraft.length){toast('Nothing to add.');return;}
  pastePendingApply=null;
  const snapshot={addedTasks:[],addedRoutine:[],addedContent:[],addedBank:[],replacedDates:[],replacedTasks:{}};
  const conflicts=pasteTaskConflictInfo();
  if(mode==='replace'&&conflicts.dates.length){conflicts.dates.forEach(d=>{snapshot.replacedDates.push(d);snapshot.replacedTasks[d]=JSON.parse(JSON.stringify(gt(d)));T[d]=[];});}
  for(const it of pasteWholeDraft){
    if(it.type==='task'){
      const d=it.date||pDate;
      if(mode!=='replace'&&sameTask(d,it.text))continue;
      if(!T[d])T[d]=[];
      const id=uid();T[d].push({id,text:it.text,catId:it.catId||pasteCategory(it.text),done:false,createdAt:Date.now(),time:it.time||''});snapshot.addedTasks.push({date:d,id});
    }else if(it.type==='bank'){
      if(sameBank(it.text))continue;const id='b'+uid();BK.push({id,text:it.text,catId:it.catId||pasteCategory(it.text),due:it.due||'',createdAt:Date.now()});snapshot.addedBank.push(id);
    }else if(it.type==='routine'){
      const rt=it.repeatType||'weekly';const days=(it.days&&it.days.length)?it.days.slice().sort((a,b)=>a-b):[];
      const monthlyData=rt==='monthly'?{dayOfMonth:it.lastDay?null:(it.dayOfMonth||1),lastDay:!!it.lastDay,interval:it.interval||1}:{dayOfMonth:null,lastDay:false,interval:1};
      if(rt==='weekly'&&!days.length)continue;
      if(sameRoutine(it.text,it.time,days,rt,monthlyData.dayOfMonth,monthlyData.lastDay,monthlyData.interval))continue;
      const id='r'+uid();
      R.push(rt==='monthly'?{id,text:it.text,time:it.time||'',catId:it.catId||pasteCategory(it.text),repeatType:'monthly',lastDay:monthlyData.lastDay,dayOfMonth:monthlyData.dayOfMonth,interval:monthlyData.interval,anchor:tod()}:{id,text:it.text,time:it.time||'',catId:it.catId||pasteCategory(it.text),repeatType:'weekly',days});
      snapshot.addedRoutine.push(id);

      for(const d of days){if(sameContent(d,it.text))continue;const id='c'+uid();if(!CPLAN[d])CPLAN[d]=[];CPLAN[d].push({id,text:it.text,time:it.time||'',paused:false});snapshot.addedContent.push({day:d,id});}
    }
  }
  const changed= snapshot.addedTasks.length||snapshot.addedRoutine.length||snapshot.addedContent.length||snapshot.addedBank.length||snapshot.replacedDates.length;
  pasteUndoState=changed?snapshot:null;if(changed)recordPasteUndo();
  const parts=[];if(snapshot.addedTasks.length)parts.push(`${snapshot.addedTasks.length} task${snapshot.addedTasks.length!==1?'s':''}`);if(snapshot.addedRoutine.length)parts.push(`${snapshot.addedRoutine.length} routine${snapshot.addedRoutine.length!==1?'s':''}`);if(snapshot.addedContent.length)parts.push(`${snapshot.addedContent.length} content item${snapshot.addedContent.length!==1?'s':''}`);if(snapshot.addedBank.length)parts.push(`${snapshot.addedBank.length} Task Bank item${snapshot.addedBank.length!==1?'s':''}`);
  sT();sBK();sR();sCPL();closePasteWholePlan();rPlan();updHeader();toast((parts.join(' · ')||'Nothing added')+(mode==='replace'&&conflicts.count?` · replaced ${conflicts.count} existing task${conflicts.count!==1?'s':''}`:''));
}
function applyPasteWholePlan(){

    <button class="qbtn ${hDate===off(-2)?'active':''}" onclick="shd('${off(-2)}')">2 days ago</button>

    </div>`;

    body+=`ROUTINES\n`+rt.map(r=>r.time?`${t12(r.time)} — ${r.text}`:`${r.text} (no set time)`).join('\n');
  }
  const text=`Please set alarms for today (${fdate(today)}):\n\n${body}`;

function cgWeekStart(g,date){return addDays(g.start,Math.floor(dDays(g.start,date)/7)*7);}
function cgKey(g,date){return g.mode==='weekly' ? 'W'+cgWeekStart(g,date) : date;}
function cgStats(g){
  const today=tod();
  const weekly=g.mode==='weekly';
  const totalDays=Math.max(1,dDays(g.start,g.end)+1);
  const totalPeriods=weekly?Math.ceil(totalDays/7):totalDays;
  let elapsed;
  if(today<g.start)elapsed=0;
  else{const ref=today>g.end?g.end:today;elapsed=weekly?Math.floor(dDays(g.start,ref)/7)+1:dDays(g.start,ref)+1;}
  elapsed=Math.max(0,Math.min(totalPeriods,elapsed));
  const items=g.items||[];const log=g.log||{};
  const curKey=cgKey(g,today);
  const cur=log[curKey]||{};
  const todayDone=items.filter(it=>cur[it.id]).length;
  const todayPct=items.length?Math.round(todayDone/items.length*100):0;
  let ticks=0;
  Object.keys(log).forEach(k=>{
    let d;
    if(weekly){if(k[0]!=='W')return;d=k.slice(1);}else{if(k[0]==='W')return;d=k;}
    const capEnd=(g.end<today?g.end:today);
    if(d>=g.start&&d<=capEnd){items.forEach(it=>{if(log[k][it.id])ticks++;});}
  });
  const denom=items.length*Math.max(1,elapsed);
  const overallPct=denom?Math.round(ticks/denom*100):0;
  return {weekly,totalPeriods,elapsed,todayDone,todayPct,ticks,overallPct,ended:today>g.end,notStarted:today<g.start,itemCount:items.length,unit:weekly?'Week':'Day',curKey};
}
function cgPeriods(g){
  const weekly=g.mode==='weekly';
  const totalDays=Math.max(1,dDays(g.start,g.end)+1);
  const totalPeriods=weekly?Math.ceil(totalDays/7):totalDays;
  const items=g.items||[];const log=g.log||{};const today=tod();
  const out=[];
  for(let i=0;i<totalPeriods;i++){
    const pdate=weekly?addDays(g.start,i*7):addDays(g.start,i);
    const key=weekly?'W'+pdate:pdate;
    const m=log[key]||{};
    const done=items.filter(it=>m[it.id]).length;
    const pct=items.length?Math.round(done/items.length*100):0;
    let isFuture,isCurrent;
    if(weekly){const wend=addDays(pdate,6);isFuture=pdate>today;isCurrent=today>=pdate&&today<=wend;}
    else{isFuture=pdate>today;isCurrent=pdate===today;}
    out.push({i,pdate,done,total:items.length,pct,isFuture,isCurrent});
  }
  return out;
}
function cgLen(g){
  const totalDays=Math.max(1,dDays(g.start,g.end)+1);
  return g.mode==='weekly'?Math.ceil(totalDays/7):totalDays;
}
function restartPanel(g){
  const weekly=g.mode==='weekly';
  return `<div class="edit-area" id="gr_${g.id}" style="border-color:var(--green)">
    <div class="flbl" style="color:var(--green);margin-bottom:7px;letter-spacing:.3px">Restart · keeps your rules, clears every past check-in</div>
    <div class="erow">
      <div style="flex:1"><div class="flbl">New start date</div><input type="date" class="input input-sm" id="rs_${g.id}" value="${tod()}"/></div>
      <div style="flex:1"><div class="flbl">Length (${weekly?'weeks':'days'})</div><input type="number" min="1" class="input input-sm" id="rl_${g.id}" value="${cgLen(g)}"/></div>
    </div>
    <button class="btn btn-full btn-green" style="padding:10px;font-size:12.5px;margin-bottom:0" onclick="restartGroup('${g.id}')">🔄 Restart Challenge</button>
  </div>`;
}
function cgPreviewPeriods(g){
  const all=cgPeriods(g);
  const current=all.findIndex(function(p){return p.isCurrent;});
  if(all.length<=7)return all;
  const center=current>=0?current:0;
  const start=Math.max(0,Math.min(all.length-7,center-3));
  return all.slice(start,start+7);
}
function cgGridHTML(g,full){
  full=!!full;
  const allPeriods=cgPeriods(g);
  const periods=full?allPeriods:cgPreviewPeriods(g);
  const items=g.items||[],log=g.log||{};
  const cellLabel=function(p){return full?fshort(p.pdate):(g.mode==='weekly'?('W'+(p.i+1)):new Date(p.pdate+'T00:00:00').getDate());};
  let h=`<div class="cg-grid-scroll ${full?'cg-grid-full-scroll':''}"><table class="cg-grid ${full?'cg-grid-full':'cg-grid-preview'}"><thead><tr><th class="cg-rule-head">HABITS</th>`;
  periods.forEach(function(p){h+=`<th class="cg-day-head ${p.isCurrent?'current':''}">${cellLabel(p)}</th>`;});
  h+=`<th class="cg-rate-head">%</th></tr></thead><tbody>`;
  items.forEach(function(it){
    let doneCount=0;
    allPeriods.forEach(function(p){const key=g.mode==='weekly'?'W'+p.pdate:p.pdate;if(log[key]&&log[key][it.id])doneCount++;});
    const rate=allPeriods.length?Math.round(doneCount/allPeriods.length*100):0;
    h+=`<tr><th class="cg-rule" title="${esc(it.text)}"><span class="cg-rule-num">${String(items.indexOf(it)+1).padStart(2,'0')}</span><span>${esc(it.text)}</span></th>`;
    periods.forEach(function(p){
      const key=g.mode==='weekly'?'W'+p.pdate:p.pdate;
      const done=!!(log[key]&&log[key][it.id]);
      const past=!p.isFuture&&!p.isCurrent;
      const cls=done?'done':(p.isFuture?'future':(p.isCurrent?'today-cell':'missed'));
      const aria=done?'Completed':past?'Missed':p.isCurrent?'Today':'Upcoming';
      h+=`<td class="cg-grid-cell ${cls} ${p.isCurrent?'current':''}" onclick="togGroupItemGrid('${g.id}','${it.id}','${p.pdate}')" title="${aria}"><span>${done?'✓':(past?'❌':'')}</span></td>`;
    });
    h+=`<td class="cg-rate">${rate}%</td></tr>`;
  });
  h+=`</tbody></table></div><div class="cg-grid-legend"><span><i class="cg-legend done"></i>Done</span><span><i class="cg-legend missed"></i>Missed</span><span><i class="cg-legend today"></i>Today</span><span><i class="cg-legend future"></i>Future</span></div>`;
  return h;
}

function togContent(id){

function setContentLogo(ev,id){
  const file=ev.target.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('Choose an image file.');
  const fr=new FileReader();
  fr.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=256,scale=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      CLOG[id]=c.toDataURL('image/jpeg',0.84);sCLOG();
      if(curTab==='content')rContent();else rSettings();
      toast('Channel logo saved ✅');
    };
    img.onerror=()=>toast('That logo could not be loaded.');
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
  ev.target.value='';
}
function removeContentLogo(id){
  if(!CLOG[id])return;
  if(!confirm('Remove this channel logo?'))return;
  delete CLOG[id];sCLOG();
  if(curTab==='content')rContent();else rSettings();
  toast('Channel logo removed');
}

function saveContentSettings(id,oldDay){
  const src=CPLAN[oldDay]||[];const item=src.find(x=>x.id===id);if(!item)return;

  const nd=parseInt(document.getElementById('csd_'+id)?.value,10);

  if(!nt)return toast('Content name cannot be empty!');
  if(isNaN(nd)||nd<0||nd>6)return toast('Pick a day!');
  item.text=nt;item.time=time;item.paused=!!item.paused;
  if(nd!==oldDay){
    CPLAN[oldDay]=src.filter(x=>x.id!==id);
    if(!CPLAN[nd])CPLAN[nd]=[];
    CPLAN[nd].push(item);
  }
  sCPL();contentSettingsOpen[id]=false;rSettings();updHeader();toast('Content updated ✅');

function deleteContentSetting(id){
  const found=contentAllItems().find(x=>x.id===id);if(!found)return;
  const item=(CPLAN[found._day]||[]).find(x=>x.id===id);if(!item)return;
  if(!confirm(`Delete content "${item.text}"?\n\nThis removes it from the weekly content plan.`))return;
  CPLAN[found._day]=(CPLAN[found._day]||[]).filter(x=>x.id!==id);
  if(!CPLAN[found._day].length)delete CPLAN[found._day];
  sCPL();rSettings();updHeader();toast('Content removed');
}

let deferredInstallPrompt=null;

  b.textContent=deferredInstallPrompt?'📲 Install Life Tracker':'📲 Install Life Tracker';

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`philip_tracker_${tod()}.json`;a.click();toast('Backup downloaded! 📥');
}
function restore(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const d=JSON.parse(e.target.result);
    if(d.T){T={...T,...d.T};sT();}if(d.H){H=d.H;sH();}
    if(d.HL){HL={...HL,...d.HL};sHL();}if(d.C){C=d.C;sC();}
    if(d.PT){PT={...PT,...d.PT};sPT();}
    if(d.CHL){CHL=d.CHL;sCHL();}
    if(d.CPLAN&&(d.CPLVER||0)>=CPLVER){CPLAN=d.CPLAN;if((d.CMIG||0)<CMIG33)migContent33(CPLAN);migContent35(CPLAN);sCPL();}
    else{CPLAN=JSON.parse(JSON.stringify(DCPLAN));sCPL();}
    sv(SK.cpv,CPLVER);
    if(d.CC){CC={...CC,...d.CC};sCC();}
    if(d.CG){CG=d.CG;sCG();}
    if(d.R){R=d.R;sR();}
    if(d.BK){BK=d.BK;sBK();}
    if(typeof d.CO==='boolean'){CO=d.CO;sCO();}
    if(typeof d.CST==='string'&&d.CST){CST=d.CST;sCST();}
    if(typeof d.PI==='string'){PI=d.PI;sPI();}
    if(d.CLOG&&typeof d.CLOG==='object'){CLOG=d.CLOG;sCLOG();}
    if(d.RL){RL={...RL,...d.RL};sRL();}
    Object.keys(T||{}).forEach(k=>(T[k]||[]).forEach(t=>{if(typeof t.time!=='string')t.time='';}));sT();
    toast('Restored! ✅');render();
  }catch{toast('Failed! Check the file.');}};
  r.readAsText(file);
}
function togCarry(){
  CO=!CO;sCO();render();
  toast(CO?'Carry-over ON ↻':'Carry-over OFF');
}

function clearAll(){
  if(!confirm('Delete ALL Life Tracker data?\n\nYour other apps are NOT touched.'))return;if(!confirm('Really sure? This cannot be undone.'))return;
  const mine=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('plt_'))mine.push(k);}
  mine.forEach(k=>localStorage.removeItem(k));T={};H=DHABS;HL={};C=DCATS;PT={};CLOG={};sCLOG();CHL=seedChallenges();CPLAN=JSON.parse(JSON.stringify(DCPLAN));migContent35(CPLAN);CC={};CG=seedGroups();R=[];RL={};BK=[];CO=true;CST=tod();PI='';sCST();sPI();sH();sC();sCHL();sCPL();sCC();sCG();sR();sRL();sBK();sCO();sv(SK.cpv,CPLVER);sv('plt_cmig',CMIG35);render();toast('All cleared');
}
